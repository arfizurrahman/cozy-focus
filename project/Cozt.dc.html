<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>body{margin:0;background:oklch(0.9 0.02 70)}a{color:oklch(0.55 0.12 45)}a:hover{color:oklch(0.45 0.12 45)}button{font-family:inherit}</style>
</helmet>
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;font-family:'DM Sans',sans-serif;color:oklch(0.28 0.03 50)">
<div style="width:1000px;height:640px;display:flex;background:oklch(0.975 0.012 80);border-radius:14px;overflow:hidden;box-shadow:0 30px 70px oklch(0.4 0.05 50/0.28),0 0 0 1px oklch(0.8 0.02 70)">
  <div style="width:210px;background:oklch(0.94 0.02 75);padding:18px 14px;box-sizing:border-box;display:flex;flex-direction:column;gap:6px;border-right:1px solid oklch(0.88 0.02 70)">
    <div style="display:flex;gap:8px;padding:0 4px 18px"><span style="width:12px;height:12px;border-radius:50%;background:oklch(0.72 0.14 30)"></span><span style="width:12px;height:12px;border-radius:50%;background:oklch(0.82 0.12 85)"></span><span style="width:12px;height:12px;border-radius:50%;background:oklch(0.75 0.11 140)"></span></div>
    <div style="font-family:'Newsreader',serif;font-size:28px;padding:0 10px 16px;letter-spacing:-0.01em">cozt<span style="color:oklch(0.62 0.15 45)">.</span></div>
    <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="4">
      <button onClick="{{ t.go }}" style="{{ t.style }}">{{ t.label }}<span style="opacity:0.6;font-size:12px">{{ t.hint }}</span></button>
    </sc-for>
    <div style="margin-top:auto;padding:14px;border-radius:12px;background:oklch(0.9 0.04 75);font-size:13px;line-height:1.5">
      <div style="font-weight:600">4-day streak</div>
      <div style="opacity:0.75">One more session today keeps it going.</div>
    </div>
  </div>
  <div style="flex:1;display:flex;flex-direction:column;min-width:0">
    <sc-if value="{{ isFocus }}" hint-placeholder-val="{{ true }}">
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;background:{{ bg }}">
      <div style="display:flex;gap:4px;padding:4px;border-radius:999px;background:oklch(1 0 0/0.55)">
        <sc-for list="{{ modes }}" as="m" hint-placeholder-count="3"><button onClick="{{ m.go }}" style="{{ m.style }}">{{ m.label }}</button></sc-for>
      </div>
      <div style="position:relative;width:320px;height:320px">
        <svg width="320" height="320" viewBox="0 0 320 320" style="transform:rotate(-90deg)"><circle cx="160" cy="160" r="148" fill="oklch(1 0 0/0.5)" stroke="oklch(0.3 0.03 50/0.1)" stroke-width="8"></circle><circle cx="160" cy="160" r="148" fill="none" stroke="{{ accent }}" stroke-width="8" stroke-linecap="round" stroke-dasharray="930" stroke-dashoffset="{{ offset }}"></circle></svg>
        <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center">
          <div style="font-family:'Newsreader',serif;font-size:86px;line-height:1;letter-spacing:-0.02em;font-variant-numeric:tabular-nums">{{ clock }}</div>
          <div style="margin-top:10px;font-size:14px;opacity:0.7">{{ caption }}</div>
        </div>
      </div>
      <div style="display:flex;gap:12px;align-items:center">
        <button onClick="{{ reset }}" style="width:48px;height:48px;border-radius:50%;border:1px solid oklch(0.3 0.03 50/0.2);background:transparent;font-size:18px;cursor:pointer;color:inherit" title="Reset">↺</button>
        <button onClick="{{ toggle }}" style="min-width:160px;height:56px;border-radius:999px;border:0;background:{{ accent }};color:oklch(0.99 0.01 80);font-size:17px;font-weight:600;cursor:pointer">{{ toggleLabel }}</button>
        <button onClick="{{ skip }}" style="width:48px;height:48px;border-radius:50%;border:1px solid oklch(0.3 0.03 50/0.2);background:transparent;font-size:16px;cursor:pointer;color:inherit" title="Skip">⏭</button>
      </div>
      <div style="display:flex;gap:8px;align-items:center;font-size:13px;opacity:0.8"><span>Session {{ done }} of 4</span><span style="display:flex;gap:5px"><sc-for list="{{ dots }}" as="d" hint-placeholder-count="4"><span style="{{ d }}"></span></sc-for></span></div>
    </div>
    </sc-if>
    <sc-if value="{{ isTasks }}" hint-placeholder-val="{{ false }}">
    <div style="flex:1;padding:44px 52px;overflow:auto">
      <div style="font-family:'Newsreader',serif;font-size:36px">Today</div>
      <div style="opacity:0.65;margin:4px 0 24px">{{ taskSummary }}</div>
      <div style="display:flex;gap:8px;margin-bottom:18px"><input value="{{ draft }}" onChange="{{ setDraft }}" onKeyDown="{{ draftKey }}" placeholder="Add a task, press Enter" style="flex:1;height:44px;border-radius:10px;border:1px solid oklch(0.85 0.02 70);background:oklch(1 0.005 80);padding:0 14px;font:inherit;outline:none"></input></div>
      <div style="display:flex;flex-direction:column;gap:8px">
      <sc-for list="{{ tasks }}" as="k" hint-placeholder-count="4">
        <div style="display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:12px;background:oklch(1 0.005 80);border:1px solid oklch(0.9 0.015 70)">
          <button onClick="{{ k.tick }}" style="{{ k.box }}">{{ k.mark }}</button>
          <span style="{{ k.text }}">{{ k.title }}</span>
          <span style="margin-left:auto;font-size:13px;opacity:0.6">{{ k.est }} ●</span>
        </div>
      </sc-for></div>
    </div>
    </sc-if>
    <sc-if value="{{ isStats }}" hint-placeholder-val="{{ false }}">
    <div style="flex:1;padding:44px 52px;overflow:auto">
      <div style="font-family:'Newsreader',serif;font-size:36px">This week</div>
      <div style="display:flex;gap:14px;margin:22px 0 28px">
        <sc-for list="{{ kpis }}" as="p" hint-placeholder-count="3"><div style="flex:1;padding:18px;border-radius:14px;background:oklch(0.94 0.025 75)"><div style="font-family:'Newsreader',serif;font-size:38px">{{ p.v }}</div><div style="font-size:13px;opacity:0.7">{{ p.l }}</div></div></sc-for>
      </div>
      <div style="display:flex;align-items:flex-end;gap:16px;height:200px;padding:20px;border-radius:14px;background:oklch(1 0.005 80);border:1px solid oklch(0.9 0.015 70)">
        <sc-for list="{{ bars }}" as="b" hint-placeholder-count="7"><div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:8px;height:100%"><div style="{{ b.style }}"></div><span style="font-size:12px;opacity:0.65">{{ b.d }}</span></div></sc-for>
      </div>
    </div>
    </sc-if>
    <sc-if value="{{ isSettings }}" hint-placeholder-val="{{ false }}">
    <div style="flex:1;padding:44px 52px;overflow:auto">
      <div style="font-family:'Newsreader',serif;font-size:36px;margin-bottom:22px">Settings</div>
      <div style="display:flex;flex-direction:column;gap:2px">
      <sc-for list="{{ durations }}" as="r" hint-placeholder-count="3">
        <div style="display:flex;align-items:center;padding:16px 0;border-bottom:1px solid oklch(0.9 0.015 70)"><span>{{ r.l }}</span>
          <span style="margin-left:auto;display:flex;align-items:center;gap:12px"><button onClick="{{ r.minus }}" style="width:30px;height:30px;border-radius:50%;border:1px solid oklch(0.85 0.02 70);background:transparent;cursor:pointer;color:inherit">−</button><span style="width:56px;text-align:center;font-variant-numeric:tabular-nums">{{ r.v }} min</span><button onClick="{{ r.plus }}" style="width:30px;height:30px;border-radius:50%;border:1px solid oklch(0.85 0.02 70);background:transparent;cursor:pointer;color:inherit">+</button></span></div>
      </sc-for>
      <sc-for list="{{ toggles }}" as="s" hint-placeholder-count="3">
        <div style="display:flex;align-items:center;padding:16px 0;border-bottom:1px solid oklch(0.9 0.015 70)"><span>{{ s.l }}</span>
          <button onClick="{{ s.go }}" style="{{ s.track }}"><span style="{{ s.knob }}"></span></button></div>
      </sc-for></div>
    </div>
    </sc-if>
  </div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { tab: 'focus', mode: 'focus', running: false, left: 1500, done: 1, draft: '',
    dur: { focus: 25, short: 5, long: 15 },
    on: { 'Auto-start breaks': true, 'Soft chime': true, 'Desktop notifications': false },
    tasks: [{ title: 'Outline the launch email', est: 2, ok: true }, { title: 'Review pull requests', est: 3, ok: false }, { title: 'Plan next week', est: 1, ok: false }] };
  componentDidMount() { this.iv = setInterval(() => { const s = this.state; if (!s.running) return; if (s.left <= 1) this.setState({ running: false, left: 0, done: s.mode === 'focus' ? Math.min(4, s.done + 1) : s.done }); else this.setState({ left: s.left - 1 }); }, 1000); }
  componentWillUnmount() { clearInterval(this.iv); }
  pick(mode) { this.setState(s => ({ mode, running: false, left: s.dur[mode] * 60 })); }
  renderVals() {
    const s = this.state, C = { focus: ['oklch(0.96 0.03 55)', 'oklch(0.6 0.15 40)', 'Time to focus'], short: ['oklch(0.96 0.03 145)', 'oklch(0.55 0.1 150)', 'Take a breather'], long: ['oklch(0.96 0.025 240)', 'oklch(0.55 0.1 240)', 'Long rest, you earned it'] }[s.mode];
    const total = s.dur[s.mode] * 60, m = Math.floor(s.left / 60), sec = s.left % 60;
    const tabDefs = [['focus', 'Focus', '⌘1'], ['tasks', 'Tasks', '⌘2'], ['stats', 'Stats', '⌘3'], ['settings', 'Settings', '⌘,']];
    const ink = 'oklch(0.28 0.03 50)';
    const tasks = s.tasks.map((k, i) => ({ title: k.title, est: k.est, mark: k.ok ? '✓' : '',
      tick: () => this.setState(st => ({ tasks: st.tasks.map((x, j) => j === i ? { ...x, ok: !x.ok } : x) })),
      box: `width:24px;height:24px;border-radius:50%;cursor:pointer;padding:0;font-size:13px;color:#fff;border:1.5px solid ${k.ok ? 'oklch(0.6 0.15 40)' : 'oklch(0.8 0.02 70)'};background:${k.ok ? 'oklch(0.6 0.15 40)' : 'transparent'}`,
      text: k.ok ? 'text-decoration:line-through;opacity:0.5' : '' }));
    const open = s.tasks.filter(k => !k.ok).length;
    const days = [['M', 5], ['T', 7], ['W', 4], ['T', 8], ['F', 6], ['S', 2], ['S', 3]];
    const labels = { focus: 'Focus', short: 'Short break', long: 'Long break' };
    return {
      tabs: tabDefs.map(([id, label, hint]) => ({ label, hint, go: () => this.setState({ tab: id }),
        style: `display:flex;justify-content:space-between;align-items:center;border:0;border-radius:10px;padding:10px 12px;font-size:15px;cursor:pointer;text-align:left;color:${ink};background:${s.tab === id ? 'oklch(0.99 0.008 80)' : 'transparent'};font-weight:${s.tab === id ? 600 : 400};box-shadow:${s.tab === id ? '0 1px 3px oklch(0.4 0.05 50/0.15)' : 'none'}` })),
      isFocus: s.tab === 'focus', isTasks: s.tab === 'tasks', isStats: s.tab === 'stats', isSettings: s.tab === 'settings',
      bg: C[0], accent: C[1], caption: C[2] + (s.tasks.find(k => !k.ok) && s.mode === 'focus' ? ' · ' + s.tasks.find(k => !k.ok).title : ''),
      modes: Object.keys(labels).map(k => ({ label: labels[k], go: () => this.pick(k), style: `border:0;border-radius:999px;padding:8px 16px;font-size:14px;cursor:pointer;color:${ink};background:${s.mode === k ? 'oklch(1 0 0)' : 'transparent'};font-weight:${s.mode === k ? 600 : 400}` })),
      offset: 930 * (1 - s.left / total), clock: String(m).padStart(2, '0') + ':' + String(sec).padStart(2, '0'),
      toggleLabel: s.running ? 'Pause' : s.left === 0 ? 'Restart' : 'Start',
      toggle: () => s.left === 0 ? this.setState({ left: total, running: true }) : this.setState({ running: !s.running }),
      reset: () => this.setState({ running: false, left: total }),
      skip: () => this.pick(s.mode === 'focus' ? 'short' : 'focus'),
      done: s.done, dots: [1, 2, 3, 4].map(n => `width:9px;height:9px;border-radius:50%;background:${n <= s.done ? C[1] : 'oklch(0.3 0.03 50/0.15)'}`),
      tasks, taskSummary: `${open} to go · ${s.tasks.length - open} done`, draft: s.draft,
      setDraft: e => this.setState({ draft: e.target.value }),
      draftKey: e => { if (e.key === 'Enter' && e.target.value.trim()) this.setState(st => ({ tasks: [...st.tasks, { title: e.target.value.trim(), est: 1, ok: false }], draft: '' })); },
      kpis: [{ v: '35', l: 'Sessions' }, { v: '14h 35m', l: 'Focused' }, { v: '5', l: 'Day best streak' }],
      bars: days.map(([d, n]) => ({ d, style: `width:100%;max-width:44px;height:${n * 16}px;border-radius:8px 8px 4px 4px;background:${n === 8 ? 'oklch(0.6 0.15 40)' : 'oklch(0.85 0.06 55)'}` })),
      durations: [['focus', 'Focus'], ['short', 'Short break'], ['long', 'Long break']].map(([k, l]) => ({ l, v: s.dur[k],
        minus: () => this.setState(st => ({ dur: { ...st.dur, [k]: Math.max(1, st.dur[k] - 1) }, ...(st.mode === k && !st.running ? { left: Math.max(1, st.dur[k] - 1) * 60 } : {}) })),
        plus: () => this.setState(st => ({ dur: { ...st.dur, [k]: st.dur[k] + 1 }, ...(st.mode === k && !st.running ? { left: (st.dur[k] + 1) * 60 } : {}) })) })),
      toggles: Object.keys(s.on).map(l => ({ l, go: () => this.setState(st => ({ on: { ...st.on, [l]: !st.on[l] } })),
        track: `margin-left:auto;width:44px;height:26px;border-radius:999px;border:0;padding:3px;cursor:pointer;display:flex;justify-content:${s.on[l] ? 'flex-end' : 'flex-start'};background:${s.on[l] ? 'oklch(0.6 0.15 40)' : 'oklch(0.85 0.02 70)'}`,
        knob: 'width:20px;height:20px;border-radius:50%;background:#fff' }))
    };
  }
}
</script>
</body>
</html>
